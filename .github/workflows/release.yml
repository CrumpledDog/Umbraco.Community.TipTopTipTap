name: Build and Package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_TESTSITE: "src/Umbraco.Community.TipTopTipTap.DemoSite"
  PATH_TO_CLIENT: "src/Umbraco.Community.TipTopTipTap/Client"
  DOTNET_VERSION: '10'
  PACKABLE_PROJECTS: "src/Umbraco.Community.TipTopTipTap/Umbraco.Community.TipTopTipTap.csproj"

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to nuget.org'
        required: false
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      prerelease_id: ${{ steps.calculate-branch.outputs.prerelease_id }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Calculate Branch Slug
        id: calculate-branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"

          if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
            BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/feature\//ft-/g; s/hotfix\//hf-/g; s/\//-/g' | cut -c 1-12 | sed 's/-$//')
            PRERELEASE_ID="00-${BRANCH_SLUG}"
            echo "prerelease_id=$PRERELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "prerelease_id=" >> $GITHUB_OUTPUT
          fi

      - name: Update .releaserc for current branch
        if: ${{ steps.calculate-branch.outputs.prerelease_id != '' }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          PRERELEASE_ID="${{ steps.calculate-branch.outputs.prerelease_id }}"
          jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
            '.branches += [{"name": $name, "prerelease": $prerelease}]' \
            .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc

      - name: Semantic Release (Dry Run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            conventional-changelog-conventionalcommits@^9

      - name: Check Release
        run: |
          if [ -z "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "::error::No release version generated. Ensure there are conventional commits since the last release."
            exit 1
          fi

  build:
    name: Build, Run and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    env:
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: '${{ env.PATH_TO_CLIENT }}/package-lock.json'

    - name: Install Client dependencies
      working-directory: ${{ env.PATH_TO_CLIENT }}
      run: npm ci

    # Must run BEFORE "Build Client" below - it stamps the real semver into
    # Client/public/umbraco-package.json, and Vite copies public/ into the build output verbatim.
    # Running it after the build (as this used to) meant the packed package's umbraco-package.json
    # always shipped the placeholder "0.0.0", which Umbraco's backoffice uses as the bundle JS's
    # cache-busting query string - so every release looked identical to the browser's HTTP cache.
    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: src/Umbraco.Community.TipTopTipTap

    # This package ships zero backend C# logic - the Client bundle is the whole product, and it
    # must be built (into src/Umbraco.Community.TipTopTipTap/wwwroot/App_Plugins/**) *before* the
    # DemoSite is built below, since the DemoSite picks up the package's static web assets at its
    # own build time via the ProjectReference - not at publish/run time.
    - name: Build Client
      working-directory: ${{ env.PATH_TO_CLIENT }}
      run: npm run build

    - name: Dotnet Format check
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Run Tests
      run: dotnet test tests/Umbraco.Community.TipTopTipTap.Tests/Umbraco.Community.TipTopTipTap.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Publish Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Test Results
        path: TestResults/*.trx
        reporter: dotnet-trx

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Build Project
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release

    - name: Start Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup dotnet run --no-build --no-restore -c Release > ../../app.log 2> ../../app-errors.log &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        sleep 5

    - name: Health Check
      shell: bash
      run: |
        # This package has no Management API, so there's no swagger.json to poll. Instead this polls
        # the package's own compiled Client bundle under App_Plugins as a static web asset - this
        # confirms both that the DemoSite booted *and* that the static web assets actually got built
        # and copied into place, which is arguably a better signal for a Client-only package anyway.
        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44399/App_Plugins/UmbracoCommunityTipTopTipTap/umbraco-community-tip-top-tip-tap.js | grep -q "200"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

    - name: Stop Project
      if: always()
      shell: bash
      run: |
        if [ -n "$DOTNET_PID" ] && ps -p $DOTNET_PID > /dev/null 2>&1; then
          kill $DOTNET_PID 2>/dev/null || true
          sleep 2
        fi

    - name: Check for Startup Errors
      shell: pwsh
      run: '.github/scripts/Check-StartupErrors.ps1 -LogPath "${{ env.PATH_TO_TESTSITE }}/umbraco/Logs"'

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Pack NuGet Packages
      run: |
        mkdir -p artifacts/nuget
        for proj in ${{ env.PACKABLE_PROJECTS }}; do
          dotnet pack "$proj" --configuration Release -o artifacts/nuget /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}
        done

    - name: Upload NuGet Packages for Testing
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          artifacts/nuget/*.nupkg
          artifacts/nuget/*.snupkg
        retention-days: 1

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sqlite-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3

  test-packages:
    name: Test Packed NuGet Packages Standalone
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'nektos/act' }}
    needs: [setup, build]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./nuget-packages

    - name: Flatten NuGet Packages
      shell: bash
      run: |
        mkdir -p ./nuget-packages-flat
        find ./nuget-packages -name "*.nupkg" -o -name "*.snupkg" | xargs -I{} cp {} ./nuget-packages-flat/

    - name: Configure NuGet with Package Source Mapping
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        cat > nuget.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="LocalPackages" value="${{ github.workspace }}/nuget-packages-flat" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="LocalPackages">
              <package pattern="Umbraco.Community.TipTopTipTap*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    # See ci.yml's identical step for the full explanation: NuGet's global package cache is
    # keyed by package ID + version, and dry-run semantic-release's "next version" is identical
    # across every CI run until a real release happens, so without clearing it first,
    # `dotnet add package` would silently reuse STALE cached content from an earlier run instead
    # of the .nupkg this run just packed.
    - name: Clear cached local package (avoid stale content for same-version dev builds)
      run: rm -rf ~/.nuget/packages/umbraco.community.tiptoptiptap

    - name: Replace ProjectReference with PackageReference
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        set -e
        dotnet remove reference ../Umbraco.Community.TipTopTipTap/Umbraco.Community.TipTopTipTap.csproj
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }}

    - name: Restore and Build with NuGet Packages
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release

    - name: Start Application
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup dotnet run --no-build -c Release > ../../app.log 2> ../../app-errors.log &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        sleep 5

        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44399/App_Plugins/UmbracoCommunityTipTopTipTap/umbraco-community-tip-top-tip-tap.js | grep -q "200"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

    - name: Check for Startup Errors
      shell: pwsh
      run: '.github/scripts/Check-StartupErrors.ps1 -LogPath "${{ env.PATH_TO_TESTSITE }}/umbraco/Logs"'

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: package-test-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3

  e2e:
    name: E2E Tests (Playwright, against packed NuGet package)
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'nektos/act' }}
    needs: [setup, build]
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: tests/e2e/package-lock.json

    - name: Install npm dependencies - E2E tests
      working-directory: tests/e2e
      run: npm ci

    - name: Install Playwright browsers
      working-directory: tests/e2e
      run: npx playwright install --with-deps chromium

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./nuget-packages

    - name: Flatten NuGet Packages
      shell: bash
      run: |
        mkdir -p ./nuget-packages-flat
        find ./nuget-packages -name "*.nupkg" -o -name "*.snupkg" | xargs -I{} cp {} ./nuget-packages-flat/

    - name: Configure NuGet with Package Source Mapping
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        cat > nuget.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="LocalPackages" value="${{ github.workspace }}/nuget-packages-flat" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="LocalPackages">
              <package pattern="Umbraco.Community.TipTopTipTap*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    # See ci.yml's identical step for the full explanation: NuGet's global package cache is
    # keyed by package ID + version, and dry-run semantic-release's "next version" is identical
    # across every CI run until a real release happens, so without clearing it first,
    # `dotnet add package` would silently reuse STALE cached content from an earlier run instead
    # of the .nupkg this run just packed.
    - name: Clear cached local package (avoid stale content for same-version dev builds)
      run: rm -rf ~/.nuget/packages/umbraco.community.tiptoptiptap

    - name: Replace ProjectReference with PackageReference
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        set -e
        dotnet remove reference ../Umbraco.Community.TipTopTipTap/Umbraco.Community.TipTopTipTap.csproj
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }}

    - name: Restore and Build with NuGet Packages
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release

    - name: Restore Seed Database
      run: |
        mkdir -p ${{ env.PATH_TO_TESTSITE }}/umbraco/Data
        cp tests/e2e/fixtures/seed.Umbraco.sqlite.db ${{ env.PATH_TO_TESTSITE }}/umbraco/Data/Umbraco.sqlite.db

    - name: Start Test Site
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup stdbuf -oL -eL dotnet run --no-build -c Release > ./dotnet-output.log 2>&1 &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        sleep 5

    - name: Health Check
      shell: bash
      run: |
        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44399/umbraco | grep -q "200"; then
            echo "Umbraco is responding!"
            exit 0
          fi
          sleep 2
        done
        echo "Umbraco failed to respond after 30 attempts"
        exit 1

    - name: Run Playwright tests
      working-directory: tests/e2e
      env:
        E2E_BASE_URL: https://localhost:44399
      run: npm test

    - name: Write Test Summary
      if: always()
      working-directory: tests/e2e
      run: node scripts/write-summary.mjs

    - name: Stop Test Site
      if: always()
      shell: bash
      run: |
        if [ -n "$DOTNET_PID" ] && ps -p $DOTNET_PID > /dev/null 2>&1; then
          kill $DOTNET_PID 2>/dev/null || true
        fi

    - name: Upload Playwright Report on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          tests/e2e/playwright-report/
          tests/e2e/test-results/
        retention-days: 3

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: umbraco-logs-e2e
        path: |
          ${{ env.PATH_TO_TESTSITE }}/dotnet-output.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3

  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [setup, build, test-packages, e2e]
    timeout-minutes: 5
    permissions:
      id-token: write  # Required for NuGet trusted publishing (OIDC)
      packages: write  # Required for pushing to GitHub Packages
    env:
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./nuget-packages

    - name: Install Package Validation Tool
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        dotnet tool install -g dotnet-validate --prerelease
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Validate NuGet Packages
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        export PATH="$HOME/.dotnet/tools:$PATH"
        for pkg in nuget-packages/Umbraco.Community.TipTopTipTap*.nupkg; do
          dotnet validate package local "$pkg"
        done

    - name: Add GitHub Packages Source
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/CrumpledDog/index.json"

    - name: Push GitHub Packages
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget push "nuget-packages/Umbraco.Community.TipTopTipTap*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate

    - name: Push MyGet Packages
      if: needs.setup.outputs.new_release_published == 'true' && env.MYGET_API_KEY != ''
      run: |
        dotnet nuget push "nuget-packages/Umbraco.Community.TipTopTipTap*.nupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/api/v2/package --skip-duplicate
        dotnet nuget push "nuget-packages/Umbraco.Community.TipTopTipTap*.snupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/symbols/api/v2/package --skip-duplicate

    - name: NuGet Trusted Publishing Login
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/beta/')) && (!contains(needs.setup.outputs.semver, '-') || contains(needs.setup.outputs.semver, '-beta.')) }}
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}

    - name: Push to Nuget.org
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/beta/')) && (!contains(needs.setup.outputs.semver, '-') || contains(needs.setup.outputs.semver, '-beta.')) }}
      run: |
        dotnet nuget push "nuget-packages/Umbraco.Community.TipTopTipTap*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Write Summary
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        echo "## Package Built: v${{ needs.setup.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, publish]
    if: ${{ needs.setup.outputs.new_release_published == 'true' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Fetch all tags
      run: git fetch --force --tags

    # actions/checkout above pinned HEAD to the branch tip at whatever moment this job started -
    # by the time this runs, the setup/build/test/publish jobs before it have taken several
    # minutes, and any commit pushed to the branch in that window makes semantic-release's own
    # "is the local branch behind the remote" guard correctly (but unhelpfully) refuse to publish.
    # Re-pointing HEAD at the branch's current remote tip right before the real Semantic Release
    # step closes that window. Must run before the .releaserc patch below, since reset --hard
    # would otherwise discard that uncommitted change.
    - name: Sync local branch with remote tip
      run: |
        git fetch origin "${{ github.ref_name }}"
        git reset --hard "origin/${{ github.ref_name }}"

    - name: Update .releaserc for current branch
      if: ${{ needs.setup.outputs.prerelease_id != '' }}
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        PRERELEASE_ID="${{ needs.setup.outputs.prerelease_id }}"
        jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
          '.branches += [{"name": $name, "prerelease": $prerelease}]' \
          .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc

    - name: Semantic Release
      id: semantic
      uses: cycjimmy/semantic-release-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        dry_run: false
        extra_plugins: |
          @semantic-release/exec
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          conventional-changelog-conventionalcommits@^9

    # Reuses semantic-release's own generated notes (steps.semantic.outputs.new_release_notes)
    # rather than a second gh api releases/generate-notes call and manual previous-tag diffing -
    # simpler, and it's the same changelog semantic-release already computed for this version.
    - name: Generate Release Notes Body
      if: ${{ steps.semantic.outputs.new_release_published == 'true' && github.event.inputs.create_github_release != 'false' }}
      run: |
        BRANCH_NAME="${{ github.ref_name }}"

        if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
          echo "## ⚠️ Test Release from \`$BRANCH_NAME\`" > release_body.md
          echo "" >> release_body.md
          echo "This is a test release for development and testing purposes only." >> release_body.md
          echo "" >> release_body.md
          echo "### Installation" >> release_body.md
          echo "" >> release_body.md
          cat << 'EOF' >> release_body.md
        ```bash
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }} --source https://nuget.pkg.github.com/CrumpledDog/index.json
        ```
        EOF
        elif [[ "${{ github.event.inputs.publish_to_nuget }}" == "true" && ("${{ needs.setup.outputs.semver }}" != *"-"* || "${{ needs.setup.outputs.semver }}" == *"-beta."*) ]]; then
          cat << 'EOF' > release_body.md
        ## Installation

        ```bash
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }}
        ```
        EOF
        else
          echo "## Installation" > release_body.md
          echo "" >> release_body.md

          if [[ -n "${{ secrets.MYGET_API_KEY }}" ]]; then
            cat << 'EOF' >> release_body.md
        ### From MyGet (pre-release)

        ```bash
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }} --source https://www.myget.org/F/umbraco-packages/api/v3/index.json
        ```

        EOF
          fi

          cat << 'EOF' >> release_body.md
        ### From GitHub Packages (pre-release)

        ```bash
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }} --source https://nuget.pkg.github.com/CrumpledDog/index.json
        ```
        EOF
        fi

        printf '\n%s\n' "${{ steps.semantic.outputs.new_release_notes }}" | sed '/^#\+ \[/d' >> release_body.md

    - name: Update GitHub Release with Custom Notes
      if: ${{ steps.semantic.outputs.new_release_published == 'true' && github.event.inputs.create_github_release != 'false' }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.setup.outputs.semver }}
        name: v${{ needs.setup.outputs.semver }}
        body_path: release_body.md
        prerelease: ${{ contains(needs.setup.outputs.semver, '-') }}

    - name: Make merge script executable
      if: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/beta/') }}
      # Belt-and-braces: this repo is developed on Windows, where git doesn't reliably track the
      # executable bit, so the script's mode in the checkout can't be trusted to be +x.
      run: chmod +x .github/scripts/merge-to-develop.sh

    - name: Merge release branch to develop
      if: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/beta/') }}
      run: .github/scripts/merge-to-develop.sh "${{ needs.setup.outputs.semver }}"

    - name: Write Summary
      run: |
        echo "## Release Published: v${{ needs.setup.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** \`v${{ needs.setup.outputs.semver }}\`" >> $GITHUB_STEP_SUMMARY

  security:
    if: false # temporarily disabled until we can get Trivy working in GitHub Actions
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
