name: Verify Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_TESTSITE: "src/Umbraco.Community.TipTopTipTap.DemoSite"
  PATH_TO_CLIENT: "src/Umbraco.Community.TipTopTipTap/Client"
  DOTNET_VERSION: '10'
  PACKABLE_PROJECTS: "src/Umbraco.Community.TipTopTipTap/Umbraco.Community.TipTopTipTap.csproj"

on:
  push:
    branches:
      - "develop/v1"
      - "release/v1"
      - "beta/v1"
      - "feature/v1/**"
      - "hotfix/v1/**"
      - "develop/v2"
      - "release/v2"
      - "beta/v2"
      - "feature/v2/**"
      - "hotfix/v2/**"
  pull_request:
    branches:
      - develop/v1
      - release/v1
      - beta/v1
      - feature/v1/**
      - hotfix/v1/**
      - develop/v2
      - release/v2
      - beta/v2
      - feature/v2/**
      - hotfix/v2/**
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      semver: ${{ steps.set-version.outputs.version }}
      prerelease_id: ${{ steps.calculate-branch.outputs.prerelease_id }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git fetch --force --tags

      - name: Calculate Branch Slug
        id: calculate-branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Current branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
            # Convert branch name to valid semver prerelease identifier
            # Prefix with "00-" to ensure these versions sort before alpha/beta/rc
            # Truncate to max 15 chars total to keep NuGet paths short
            # Replace feature->ft and hotfix->hf to save more space
            # Trim trailing hyphen if present after truncation
            BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/feature\//ft-/g; s/hotfix\//hf-/g; s/\//-/g' | cut -c 1-12 | sed 's/-$//')
            PRERELEASE_ID="00-${BRANCH_SLUG}"
            echo "Branch slug: $BRANCH_SLUG"
            echo "Prerelease ID: $PRERELEASE_ID"
            echo "prerelease_id=$PRERELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "Branch does not match hotfix/* or feature/*, no prerelease ID needed"
            echo "prerelease_id=" >> $GITHUB_OUTPUT
          fi

      - name: Update .releaserc for current branch
        if: ${{ steps.calculate-branch.outputs.prerelease_id != '' }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          PRERELEASE_ID="${{ steps.calculate-branch.outputs.prerelease_id }}"

          jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
            '.branches += [{"name": $name, "prerelease": $prerelease}]' \
            .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc

          echo "Updated .releaserc:"
          cat .releaserc

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits@^9

      - name: Set Version
        id: set-version
        run: |
          if [ -n "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "version=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              LATEST_VERSION=${LATEST_TAG#v}
              echo "version=${LATEST_VERSION}-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            else
              echo "version=0.1.0-dev.${{ github.run_number }}" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    name: Build, Run and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: '${{ env.PATH_TO_CLIENT }}/package-lock.json'

    - name: Install Client dependencies
      working-directory: ${{ env.PATH_TO_CLIENT }}
      run: npm ci

    # Must run BEFORE "Build Client" below - it stamps the real semver into
    # Client/public/umbraco-package.json, and Vite copies public/ into the build output verbatim.
    # Running it after the build (as this used to) meant the packed package's umbraco-package.json
    # always shipped the placeholder "0.0.0", which Umbraco's backoffice uses as the bundle JS's
    # cache-busting query string - so every release looked identical to the browser's HTTP cache.
    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: src/Umbraco.Community.TipTopTipTap

    # This package ships zero backend C# logic - the Client bundle is the whole product, and it
    # must be built (into src/Umbraco.Community.TipTopTipTap/wwwroot/App_Plugins/**) *before* the
    # DemoSite is built below, since the DemoSite picks up the package's static web assets at its
    # own build time via the ProjectReference - not at publish/run time.
    - name: Build Client
      working-directory: ${{ env.PATH_TO_CLIENT }}
      run: npm run build

    - name: Dotnet Format check
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Run Tests
      run: dotnet test tests/Umbraco.Community.TipTopTipTap.Tests/Umbraco.Community.TipTopTipTap.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

    - name: Publish Test Report
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Test Results
        path: TestResults/*.trx
        reporter: dotnet-trx

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Build Project
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release

    - name: Start Project
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup dotnet run --no-build --no-restore -c Release > ../../app.log 2> ../../app-errors.log &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        sleep 5

    - name: Health Check
      shell: bash
      run: |
        # This package has no Management API, so there's no swagger.json to poll. Instead this polls
        # the package's own compiled Client bundle under App_Plugins as a static web asset - this
        # confirms both that the DemoSite booted *and* that the static web assets actually got built
        # and copied into place, which is arguably a better signal for a Client-only package anyway.
        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44399/App_Plugins/UmbracoCommunityTipTopTipTap/umbraco-community-tip-top-tip-tap.js | grep -q "200"; then
            echo "Umbraco is responding!"
            exit 0
          fi
          sleep 2
        done
        echo "Umbraco failed to respond after 30 attempts"
        exit 1

    - name: Stop Project
      if: always()
      shell: bash
      run: |
        if [ -n "$DOTNET_PID" ] && ps -p $DOTNET_PID > /dev/null 2>&1; then
          kill $DOTNET_PID 2>/dev/null || true
          sleep 2
        fi

    - name: Check for Startup Errors
      shell: pwsh
      run: '.github/scripts/Check-StartupErrors.ps1 -LogPath "${{ env.PATH_TO_TESTSITE }}/umbraco/Logs"'

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release

    - name: Pack NuGet Packages
      run: |
        mkdir -p artifacts/nuget
        for proj in ${{ env.PACKABLE_PROJECTS }}; do
          dotnet pack "$proj" --configuration Release -o artifacts/nuget /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}
        done

    - name: Upload NuGet Packages for Testing
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          artifacts/nuget/*.nupkg
          artifacts/nuget/*.snupkg
        retention-days: 1

    - name: Install Package Validation Tool
      run: |
        dotnet tool install -g dotnet-validate --prerelease
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Validate NuGet Packages
      run: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        for pkg in artifacts/nuget/Umbraco.Community.TipTopTipTap*.nupkg; do
          dotnet validate package local "$pkg"
        done

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sqlite-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3

  test-packages:
    name: Test Packed NuGet Packages Standalone
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'nektos/act' }}
    needs: [setup, build]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./nuget-packages

    - name: Flatten NuGet Packages
      shell: bash
      run: |
        # The artifact preserves the src/**/artifacts/nuget path, but NuGet's folder-based package
        # source expects packages flat (or in id/version subfolders) - nested under arbitrary paths,
        # it tries to parse an intermediate folder name as a version and silently gives up before
        # reaching the real .nupkg.
        mkdir -p ./nuget-packages-flat
        find ./nuget-packages -name "*.nupkg" -o -name "*.snupkg" | xargs -I{} cp {} ./nuget-packages-flat/

    - name: Configure NuGet with Package Source Mapping
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        cat > nuget.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="LocalPackages" value="${{ github.workspace }}/nuget-packages-flat" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="LocalPackages">
              <package pattern="Umbraco.Community.TipTopTipTap*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    # NuGet's global package cache (~/.nuget/packages, restored by the "Cache NuGet" step above)
    # is keyed by package ID + version, and this repo has never actually published a real
    # release - semantic-release's dry-run "next version" (e.g. `1.0.0-alpha.1`) is therefore
    # IDENTICAL across every CI run until a real release happens. Without clearing it first,
    # `dotnet add package` sees "this exact version is already in the global cache" from an
    # earlier run and silently reuses that STALE content instead of the .nupkg this run just
    # packed - confirmed live: this made the e2e job silently test old code for 9 consecutive
    # runs with no error of any kind, only wrong behavior.
    - name: Clear cached local package (avoid stale content for same-version dev builds)
      run: rm -rf ~/.nuget/packages/umbraco.community.tiptoptiptap

    - name: Replace ProjectReference with PackageReference
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        set -e
        dotnet remove reference ../Umbraco.Community.TipTopTipTap/Umbraco.Community.TipTopTipTap.csproj
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }}

    - name: Restore and Build with NuGet Packages
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release

    - name: Start Application
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup dotnet run --no-build -c Release > ../../app.log 2> ../../app-errors.log &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        sleep 5

        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44399/App_Plugins/UmbracoCommunityTipTopTipTap/umbraco-community-tip-top-tip-tap.js | grep -q "200"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

    - name: Check for Startup Errors
      shell: pwsh
      run: '.github/scripts/Check-StartupErrors.ps1 -LogPath "${{ env.PATH_TO_TESTSITE }}/umbraco/Logs"'

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: package-test-logs
        path: |
          app.log
          app-errors.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3

  e2e:
    name: E2E Tests (Playwright, against packed NuGet package)
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'nektos/act' }}
    needs: [setup, build]
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js environment
      uses: actions/setup-node@v6
      with:
        node-version: 'lts/*'
        cache: 'npm'
        cache-dependency-path: tests/e2e/package-lock.json

    - name: Install npm dependencies - E2E tests
      working-directory: tests/e2e
      run: npm ci

    - name: Install Playwright browsers
      working-directory: tests/e2e
      run: npx playwright install --with-deps chromium

    # Deliberately runs before the reference-swap below, same reasoning as the `test-packages`
    # job above: the restore cache should be warm before `dotnet add package`/`dotnet build`
    # trigger the first real restore, and the swap rewrites the ever-changing semver into
    # Directory.Packages.props, which would otherwise make hashFiles() produce a unique key
    # every single run if computed after.
    - name: Cache NuGet
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Download NuGet Packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: ./nuget-packages

    - name: Flatten NuGet Packages
      shell: bash
      run: |
        mkdir -p ./nuget-packages-flat
        find ./nuget-packages -name "*.nupkg" -o -name "*.snupkg" | xargs -I{} cp {} ./nuget-packages-flat/

    # This is deliberately the same real-package swap as `test-packages` above (not a
    # ProjectReference build) - the e2e site under test should be running the actual packaged
    # output (including the Client bundle, already baked into the nupkg's static web assets),
    # catching packaging bugs a ProjectReference build can't see. It's a separate job (rather
    # than folding these steps into `test-packages`) so Playwright's own failure artifacts
    # (trace/video/screenshot) and this job's Umbraco logs are uploaded independently and don't
    # get lost among the simpler startup-only assertions `test-packages` makes.
    - name: Configure NuGet with Package Source Mapping
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        cat > nuget.config <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            <add key="LocalPackages" value="${{ github.workspace }}/nuget-packages-flat" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="LocalPackages">
              <package pattern="Umbraco.Community.TipTopTipTap*" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    # NuGet's global package cache (~/.nuget/packages, restored by the "Cache NuGet" step above)
    # is keyed by package ID + version, and this repo has never actually published a real
    # release - semantic-release's dry-run "next version" (e.g. `1.0.0-alpha.1`) is therefore
    # IDENTICAL across every CI run until a real release happens. Without clearing it first,
    # `dotnet add package` sees "this exact version is already in the global cache" from an
    # earlier run and silently reuses that STALE content instead of the .nupkg this run just
    # packed - confirmed live: this made the e2e job silently test old code for 9 consecutive
    # runs with no error of any kind, only wrong behavior.
    - name: Clear cached local package (avoid stale content for same-version dev builds)
      run: rm -rf ~/.nuget/packages/umbraco.community.tiptoptiptap

    - name: Replace ProjectReference with PackageReference
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        set -e
        dotnet remove reference ../Umbraco.Community.TipTopTipTap/Umbraco.Community.TipTopTipTap.csproj
        dotnet add package Umbraco.Community.TipTopTipTap --version ${{ needs.setup.outputs.semver }}

    - name: Restore and Build with NuGet Packages
      working-directory: ${{ env.PATH_TO_TESTSITE }}
      run: dotnet build -c Release

    # Restores the committed fixture DB instead of letting the DemoSite run a fresh unattended
    # install - see tests/e2e/README.md. Confirmed locally this makes Umbraco boot straight into
    # the seeded backoffice content (no re-triggered unattended install, no migration conflict).
    - name: Restore Seed Database
      run: |
        mkdir -p ${{ env.PATH_TO_TESTSITE }}/umbraco/Data
        cp tests/e2e/fixtures/seed.Umbraco.sqlite.db ${{ env.PATH_TO_TESTSITE }}/umbraco/Data/Umbraco.sqlite.db

    - name: Start Test Site
      working-directory: ${{ github.workspace }}/${{ env.PATH_TO_TESTSITE }}
      shell: bash
      run: |
        nohup stdbuf -oL -eL dotnet run --no-build -c Release > ./dotnet-output.log 2>&1 &
        echo "DOTNET_PID=$!" >> $GITHUB_ENV
        sleep 5

    - name: Health Check
      shell: bash
      run: |
        for i in {1..30}; do
          if curl -k -s -o /dev/null -w "%{http_code}" https://localhost:44399/umbraco | grep -q "200"; then
            echo "Umbraco is responding!"
            exit 0
          fi
          sleep 2
        done
        echo "Umbraco failed to respond after 30 attempts"
        exit 1

    - name: Run Playwright tests
      working-directory: tests/e2e
      env:
        E2E_BASE_URL: https://localhost:44399
      run: npm test

    - name: Write Test Summary
      if: always()
      working-directory: tests/e2e
      run: node scripts/write-summary.mjs

    - name: Stop Test Site
      if: always()
      shell: bash
      run: |
        if [ -n "$DOTNET_PID" ] && ps -p $DOTNET_PID > /dev/null 2>&1; then
          kill $DOTNET_PID 2>/dev/null || true
        fi

    - name: Upload Playwright Report on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          tests/e2e/playwright-report/
          tests/e2e/test-results/
        retention-days: 3

    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: umbraco-logs-e2e
        path: |
          ${{ env.PATH_TO_TESTSITE }}/dotnet-output.log
          ${{ env.PATH_TO_TESTSITE }}/umbraco/Logs/
        retention-days: 3

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: false && github.actor != 'nektos/act' # temporarily disabled until we can get Trivy working in GitHub Actions
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true # requires GitHub Advanced Security on this private repo - the scan itself still ran above
        with:
          sarif_file: 'trivy-results.sarif'
